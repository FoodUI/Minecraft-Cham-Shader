# entity.properties -- entity ID mapping
#
# 语法:  entity.<编号>=<实体1> <实体2> ...
#   一个编号一行；一个实体只能属于一个编号。
#   编号 0 是"没有加载 entity.properties"的哨兵值，65535 是"文件存在但实体未列出"，
#   所以自定义编号不要用 0。
#
# 读取方式: uniform int entityId;  （gbuffers / shadow）
#
# 下面两个 ID 必须和 settings.glsl 里的 const 保持一致：
#   ID_PLAYER = 1    ID_SHADOW = 2    ID_NAMETAG = 3
#
# minecraft:entity_shadow / minecraft:name_tag 是 Iris 内置的伪实体 ID
# （投影和名称牌在游戏里并不是真的实体，但可以被这样引用）。它们只用于
# 区分"投影"和"名称牌"，**不参与透视筛选** —— 玩家透视走最初那套
# gl_Position.z *= 0.01，对整段实体生效，不依赖这个文件。
#
# 如果加载器不认这两个伪 ID，gbuffers_entities.fsh 会退回颜色/亮度启发式。

entity.1=minecraft:player
entity.2=minecraft:entity_shadow
entity.3=minecraft:name_tag
