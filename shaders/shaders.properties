# [Cham] 内透光影 Plus -- shader settings screen
# #define 决定有哪些选项, screen 决定面板布局, lang/*.lang 提供文字

screen = <profile> [XRAY] [VIS] [ADV] *

# --- 透视开关 ---
screen.XRAY = XRAY_PLAYERS XRAY_CHESTS XRAY_BEDS
screen.XRAY.columns = 1

# --- 视觉 ---
screen.VIS = NAMETAG_BG NIGHT_VISION NO_ENTITY_SHADOW XRAY_FULLBRIGHT XRAY_NOFOG
screen.VIS.columns = 2

# --- 高级 ---
screen.ADV = XRAY_F1_PANIC XRAY_DEBUG
screen.ADV.columns = 1

# 一键切换
profile.ALL = XRAY_PLAYERS XRAY_CHESTS XRAY_BEDS NIGHT_VISION XRAY_FULLBRIGHT XRAY_NOFOG XRAY_F1_PANIC
profile.OFF = !XRAY_PLAYERS !XRAY_CHESTS !XRAY_BEDS !NIGHT_VISION !XRAY_FULLBRIGHT !XRAY_NOFOG
