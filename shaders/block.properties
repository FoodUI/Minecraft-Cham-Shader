# [Cham] 内透光影 Plus -- block ID mapping
#
# 语法:  block.<编号>=<方块1> <方块2> ...
#   一个编号只能写一行；一个方块也只能属于一个编号。
#   支持 #if / #else / #endif 条件编译（按 MC_VERSION 分支）。
#
# 编号区间必须和 settings.glsl 里的一致:  床 10100 ~ 10120
#
# 版本差异（写错名字会让某些加载器整行失效）:
#   bed          1.8  - 1.11
#   *_bed        1.12 + 的 16 色床

#if MC_VERSION >= 11200
block.10101=minecraft:white_bed minecraft:orange_bed minecraft:magenta_bed minecraft:light_blue_bed minecraft:yellow_bed minecraft:lime_bed minecraft:pink_bed minecraft:gray_bed minecraft:light_gray_bed minecraft:cyan_bed minecraft:purple_bed minecraft:blue_bed minecraft:brown_bed minecraft:green_bed minecraft:red_bed minecraft:black_bed
#else
block.10102=minecraft:bed
#endif
